[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amara"
version = "0.1.0"
description = "AMARA: Adaptive Memory Architecture for Reasoning and AI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "AMARA" }
]
keywords = [
    "memory",
    "cognitive-architecture",
    "ai-reasoning",
    "autonomous-agents",
    "context-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.25,<3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.4",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "click>=8.0.0",
]

[project.scripts]
amara = "amara.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
langgraph = [
    "langgraph>=0.0.1",
    "langchain-core>=0.1.0",
]
transformers = [
    "transformers>=4.36.0",
    "torch>=2.0.0",
]
fastapi = [
    "fastapi>=0.110.0",
    "httpx>=0.28.0",
]
all-integrations = [
    "langgraph>=0.0.1",
    "langchain-core>=0.1.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/ShakeelRana624/amara-memory"
Documentation = "https://github.com/ShakeelRana624/amara-memory#readme"
Repository = "https://github.com/ShakeelRana624/amara-memory.git"
Issues = "https://github.com/ShakeelRana624/amara-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/amara"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition (common in domain models)
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001", "RUF003", "E501", "PLR2004", "ARG001", "ARG002", "B008"]
"benchmarks/*" = ["T201", "E501", "ARG001", "ARG002", "PLR2004", "E402", "F402", "B007", "PTH123", "PLC0206", "F841"]
"examples/*" = ["T201", "E501"]
"src/amara/server/routes/*" = ["B008"]
"src/amara/server/dependencies.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["amara"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "benchmarks"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]


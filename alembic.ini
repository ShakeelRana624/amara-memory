# A generic, single database configuration for AMARA.

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names; The default value is %(rev)s_%(slug)s
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with current directory
prepend_sys_path = .
path_separator = os

# Timezone for revision timestamps
timezone = UTC

# Version locations
version_locations = %(here)s/migrations/versions

# Set to 'true' to run the environment during the 'revision' command
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# corresponding .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[post_write_hooks]
